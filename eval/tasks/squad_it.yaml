task: squad_it
dataset_path: crux82/squad_it
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_squad_it
doc_to_text: "Contesto: {{context}}\n\nDomanda: {{question}}\n\nRisposta breve:"
doc_to_target: "{{answers['text'][0]}}"
process_results: !function utils.process_results_squad_it
generation_kwargs:
  until:
    - "\n"
    - "</s>"
  do_sample: false
  max_gen_toks: 32
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
  - metric: contains
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
